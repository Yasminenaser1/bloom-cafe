<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloom Cafe</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="site-nav">
    <a href="/" class="brand">🌸 Bloom Cafe</a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/menu" class="active">Menu</a>
      <a href="/#visit">Visit</a>
      <a href="/dashboard">Dashboard</a>
    </div>
  </nav>

  <header>
    <h1>Our menu</h1>
    <p>Order ahead and pick it up at the counter.</p>
  </header>

  <main>
    <div id="menu">Loading menu…</div>

    <aside id="cart">
      <h2>Your order</h2>
      <ul id="cart-lines"></ul>
      <p id="cart-empty">Nothing added yet.</p>
      <p id="cart-total"></p>
      <button id="place-order" disabled>Place order</button>
      <p id="order-status" role="status"></p>
    </aside>
  </main>

  <footer class="site-footer">
    <span>© Bloom Cafe · a demo project</span>
    <a href="/dashboard">Owner dashboard</a>
  </footer>

  <script>
    const money = cents => "$" + (cents / 100).toFixed(2);
    const menuById = {};
    const cart = {};  // menu_item_id -> quantity

    async function loadMenu() {
      const res = await fetch("/api/menu");
      const items = await res.json();

      const byCategory = {};
      for (const item of items) {
        menuById[item.id] = item;
        (byCategory[item.category] ??= []).push(item);
      }

      const menu = document.getElementById("menu");
      menu.innerHTML = "";

      for (const [category, list] of Object.entries(byCategory)) {
        const section = document.createElement("section");
        const heading = document.createElement("h2");
        heading.textContent = category;
        section.append(heading);

        for (const item of list) {
          const row = document.createElement("div");
          row.className = "item";
          row.innerHTML = `
            <div><h3></h3><p></p></div>
            <div class="buy"><span class="price"></span><button>Add</button></div>`;
          row.querySelector("h3").textContent = item.name + (item.seasonal ? " 🍂" : "");
          row.querySelector("p").textContent = item.description;
          row.querySelector(".price").textContent = money(item.price_cents);
          row.querySelector("button").addEventListener("click", () => changeQty(item.id, +1));
          section.append(row);
        }
        menu.append(section);
      }
    }

    function changeQty(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      document.getElementById("order-status").textContent = "";
      renderCart();
    }

    function renderCart() {
      const lines = document.getElementById("cart-lines");
      lines.innerHTML = "";
      let total = 0;

      for (const [id, qty] of Object.entries(cart)) {
        const item = menuById[id];
        total += item.price_cents * qty;

        const li = document.createElement("li");
        li.innerHTML = `<span class="name"></span>
          <span class="qty"><button>−</button><b></b><button>+</button></span>`;
        li.querySelector(".name").textContent = item.name;
        li.querySelector("b").textContent = qty;
        const [minus, plus] = li.querySelectorAll("button");
        minus.addEventListener("click", () => changeQty(id, -1));
        plus.addEventListener("click", () => changeQty(id, +1));
        lines.append(li);
      }

      const empty = Object.keys(cart).length === 0;
      document.getElementById("cart-empty").hidden = !empty;
      document.getElementById("cart-total").textContent = empty ? "" : "Total: " + money(total);
      document.getElementById("place-order").disabled = empty;
    }

    async function placeOrder() {
      const button = document.getElementById("place-order");
      const status = document.getElementById("order-status");
      button.disabled = true;
      status.textContent = "Placing order…";

      const items = Object.entries(cart).map(([id, qty]) => ({
        menu_item_id: Number(id),
        quantity: qty,
      }));

      try {
        const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items }),
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        for (const id of Object.keys(cart)) delete cart[id];
        renderCart();
        status.textContent = `Order #${data.order_id} placed. Total ${money(data.total_cents)}. Thank you! 🌸`;
      } catch (err) {
        status.textContent = "Sorry, the order didn't go through. Please try again.";
        button.disabled = false;
      }
    }

    document.getElementById("place-order").addEventListener("click", placeOrder);
    loadMenu()
      .then(renderCart)
      .catch(() => {
        document.getElementById("menu").textContent = "Couldn't load the menu.";
      });
  </script>
</body>
</html>
