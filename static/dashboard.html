<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloom Cafe · Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <header>
    <h1>Bloom Cafe</h1>
    <p>Owner dashboard · <span id="period">Loading…</span></p>
    <div class="range">
      <button data-days="7">7 days</button>
      <button data-days="30" class="active">30 days</button>
      <button data-days="90">90 days</button>
    </div>
  </header>

  <main class="dash-main">
    <section class="kpis">
      <div class="kpi">
        <span class="label">Revenue</span>
        <span class="value" id="kpi-revenue_cents">–</span>
        <span class="change" id="chg-revenue_cents"></span>
      </div>
      <div class="kpi">
        <span class="label">Orders</span>
        <span class="value" id="kpi-orders">–</span>
        <span class="change" id="chg-orders"></span>
      </div>
      <div class="kpi">
        <span class="label">Average ticket</span>
        <span class="value" id="kpi-avg_ticket_cents">–</span>
        <span class="change" id="chg-avg_ticket_cents"></span>
      </div>
    </section>

    <section class="card">
      <h2>Alerts <span class="hint">last 60 days</span></h2>
      <ul id="alerts"><li class="muted">Checking for unusual activity…</li></ul>
    </section>

    <section class="card">
      <h2>Daily revenue</h2>
      <div class="chart"><canvas id="daily-chart"></canvas></div>
    </section>

    <div class="two-col">
      <section class="card">
        <h2>Busiest hours</h2>
        <div class="chart"><canvas id="hour-chart"></canvas></div>
      </section>

      <section class="card">
        <h2>Top sellers</h2>
        <table id="top">
          <thead><tr><th>Item</th><th class="num">Sold</th><th class="num">Revenue</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </div>

    <section class="card">
      <h2>Often bought together</h2>
      <ul id="pairs"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
